# Telegraf Configuration for PC Monitor
# Install Telegraf: https://docs.influxdata.com/telegraf/latest/install/
#
# Usage:
#   1. Edit the [outputs.influxdb_v2] section with your InfluxDB details
#   2. Run: telegraf --config telegraf.conf

[global_tags]
  # Add tags to all metrics (useful for identifying this computer)
  # host is added automatically

[agent]
  interval = "30s"           # Collect metrics every 30 seconds
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "5s"
  flush_interval = "30s"
  flush_jitter = "5s"
  precision = "1s"
  hostname = ""              # Auto-detect hostname
  omit_hostname = false

# ============================================
# OUTPUT: InfluxDB v2 (recommended)
# ============================================
[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = "YOUR_INFLUXDB_TOKEN"
  organization = "pc-monitor"
  bucket = "pc-metrics"

  # Optional: skip TLS verification for self-signed certs
  # insecure_skip_verify = true

# ============================================
# OUTPUT: InfluxDB v1 (if using older version)
# ============================================
# [[outputs.influxdb]]
#   urls = ["http://localhost:8086"]
#   database = "pc_monitor"
#   username = "admin"
#   password = "admin"

# ============================================
# INPUT: CPU Metrics
# ============================================
[[inputs.cpu]]
  percpu = true              # Per-CPU metrics
  totalcpu = true            # Total CPU metrics
  collect_cpu_time = false
  report_active = false

# ============================================
# INPUT: Memory
# ============================================
[[inputs.mem]]
  # No config needed

# ============================================
# INPUT: Disk Usage
# ============================================
[[inputs.disk]]
  # Ignore these mount points
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

# ============================================
# INPUT: Disk I/O
# ============================================
[[inputs.diskio]]
  # No config needed - collects read/write speeds

# ============================================
# INPUT: Network
# ============================================
[[inputs.net]]
  # Collect metrics for all interfaces
  # interfaces = ["eth*", "en*", "wl*"]

# ============================================
# INPUT: System (uptime, load, etc.)
# ============================================
[[inputs.system]]
  # No config needed

# ============================================
# INPUT: Processes
# ============================================
[[inputs.processes]]
  # No config needed - counts by state

# ============================================
# INPUT: Process details (top processes)
# ============================================
[[inputs.procstat]]
  # Monitor specific processes by pattern
  # pattern = ".*"           # All processes (can be heavy)
  # exe = "python"           # Monitor Python processes

  # Or monitor by systemd unit
  # systemd_unit = "nginx.service"

# ============================================
# INPUT: GPU (NVIDIA)
# ============================================
# Uncomment if you have NVIDIA GPU with nvidia-smi
# [[inputs.nvidia_smi]]
#   bin_path = "/usr/bin/nvidia-smi"  # or "C:\\Program Files\\NVIDIA Corporation\\NVSMI\\nvidia-smi.exe"

# ============================================
# INPUT: Temperatures (Linux)
# ============================================
# [[inputs.temp]]
#   # No config needed

# ============================================
# INPUT: Windows Performance Counters
# ============================================
# Uncomment on Windows for detailed metrics
# [[inputs.win_perf_counters]]
#   [[inputs.win_perf_counters.object]]
#     ObjectName = "Processor"
#     Instances = ["*"]
#     Counters = ["% Processor Time", "% Idle Time"]
#     Measurement = "cpu"

# ============================================
# INPUT: Docker (if using containers)
# ============================================
# [[inputs.docker]]
#   endpoint = "unix:///var/run/docker.sock"
